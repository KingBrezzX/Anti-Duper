name: Runtime Staging Gates

on:
  workflow_dispatch:
    inputs:
      staging_host:
        description: 'Disposable staging host (SSH)'
        required: true
        type: string
      staging_port:
        description: 'SSH port'
        required: false
        default: '22'
        type: string
      shop_name:
        description: 'Exact third-party shop plugin being tested'
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Validate staging gate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ inputs.staging_host }}"
          test -n "${{ inputs.shop_name }}"
          echo "Staging host supplied: yes"
          echo "Exact shop target supplied: ${{ inputs.shop_name }}"

      - name: Show mandatory runtime regression plan
        run: |
          cat scripts/player-regression.md
          cat scripts/shop-compatibility.md

      - name: Show power-loss procedure
        run: |
          chmod +x scripts/power-loss-smoke.sh
          sed -n '1,240p' scripts/power-loss-smoke.sh

      - name: Gate policy
        shell: bash
        run: |
          cat <<'EOF'
          This workflow is intentionally evidence-based.
          It does NOT mark real-player, power-loss, or third-party compatibility
          as PASS merely because source code compiles.

          Required evidence before production release:
            1. Real Java client regression PASS against disposable Paper 26.2 server.
            2. Actual JVM kill/restart recovery PASS with before/after inventory evidence.
            3. Exact named third-party shop plugin PASS with its JAR installed.
            4. CI build/test/runtime smoke PASS.

          Upload the resulting reports to the workflow run before approving release.
          EOF
