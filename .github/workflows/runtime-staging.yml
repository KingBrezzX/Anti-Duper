name: Runtime Staging Gates

on:
  workflow_dispatch:
    inputs:
      staging_host:
        description: 'Disposable staging host (SSH)'
        required: true
        type: string
      staging_port:
        description: 'SSH port'
        required: false
        default: '22'
        type: string
      shop_name:
        description: 'Exact third-party shop plugin being tested'
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate:
    name: Manual real-runtime release gate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Verify staging inputs
        run: |
          set -euo pipefail
          test -n "${{ inputs.staging_host }}"
          test -n "${{ inputs.shop_name }}"
          echo "Staging host supplied."
          echo "Shop target: ${{ inputs.shop_name }}"

      - name: Print reproducible test procedures
        run: |
          set -euo pipefail
          echo "=== REAL PLAYER REGRESSION ==="
          cat scripts/player-regression.md
          echo
          echo "=== POWER LOSS ==="
          cat scripts/power-loss-smoke.sh
          echo
          echo "=== SHOP COMPATIBILITY ==="
          cat scripts/shop-compatibility.md

      - name: Release gate policy
        run: |
          set -euo pipefail
          echo "This workflow does not fabricate player/client results."
          echo "A human/operator must execute the staging procedures on the supplied environment."
          echo "Do NOT mark production READY until the recorded staging evidence is attached to the release audit."
