name: Build BedrockAntiDupe

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Build and verify
        run: mvn -B -U clean verify

      - name: Verify release JAR
        shell: bash
        run: |
          JAR="target/BedrockAntiDupe-2.7.0.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q 'xyz/zyrex/bedrockantidupe/BedrockAntiDupe.class'
          MAJOR=$(javap -verbose -classpath "$JAR" xyz.zyrex.bedrockantidupe.BedrockAntiDupe | awk '/major version/ {print $3; exit}')
          test "$MAJOR" = "69"
          echo "Release JAR verified: Java class major 69 (Java 25)"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BedrockAntiDupe-2.7.0
          path: target/BedrockAntiDupe-2.7.0.jar
          if-no-files-found: error
