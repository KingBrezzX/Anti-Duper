name: Build BedrockAntiDupe

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Test & Paper 26.2 Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify English user-facing resources
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import re

          paths = [
              Path("src/main/resources/messages.yml"),
              Path("src/main/resources/config.yml"),
              Path("src/main/resources/plugin.yml"),
          ]
          forbidden = re.compile(r"\b(Kamu|tidak|berhasil|aktif|nonaktif|Gagal|Pemeriksaan|YA|TIDAK)\b", re.IGNORECASE)
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if forbidden.search(text):
                  raise SystemExit(f"Non-English user-facing text found in {path}")
          print("English resource check: PASS")
          PY2

      - name: Verify Java
        run: |
          set -euo pipefail
          java -version
          javac -version

          JAVA_MAJOR="$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d. -f1)"

          if [ "$JAVA_MAJOR" != "25" ]; then
            echo "ERROR: Java 25 is required."
            exit 1
          fi

      - name: Build and run tests
        run: |
          set -euo pipefail
          mvn -B -U clean verify

      - name: Verify test reports
        run: |
          set -euo pipefail

          if [ ! -d "target/surefire-reports" ]; then
            echo "ERROR: Surefire reports were not generated."
            exit 1
          fi

          TEST_COUNT="$(grep -Rho 'tests="[0-9]\+"' target/surefire-reports 2>/dev/null \
            | sed 's/[^0-9]//g' \
            | awk '{sum += $1} END {print sum+0}')"

          echo "Automated tests executed: ${TEST_COUNT}"

          if [ "$TEST_COUNT" -le 0 ]; then
            echo "ERROR: No automated tests were executed."
            exit 1
          fi

          if grep -R "failures=\"[1-9]" target/surefire-reports 2>/dev/null; then
            echo "ERROR: Test failures detected."
            exit 1
          fi

          if grep -R "errors=\"[1-9]" target/surefire-reports 2>/dev/null; then
            echo "ERROR: Test errors detected."
            exit 1
          fi

      - name: Verify release version
        run: |
          set -euo pipefail

          VERSION="$(mvn -q -DforceStdout help:evaluate \
            -Dexpression=project.version)"

          echo "Release version: ${VERSION}"

          case "$VERSION" in
            *-SNAPSHOT)
              echo "ERROR: Release build must not use SNAPSHOT version."
              exit 1
              ;;
          esac

      - name: Verify release JAR
        run: |
          set -euo pipefail

          JAR="target/BedrockAntiDupe-$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version).jar"

          if [ ! -f "$JAR" ]; then
            echo "ERROR: Release JAR not found:"
            echo "$JAR"
            exit 1
          fi

          echo "Release JAR:"
          echo "$JAR"

          CLASS_FILE="$(find target/classes -type f -name '*.class' | head -n 1)"

          if [ -z "$CLASS_FILE" ]; then
            echo "ERROR: No compiled class found."
            exit 1
          fi

          CLASS_MAJOR="$(javap -verbose "$CLASS_FILE" \
            | awk '/major version/ {print $3; exit}')"

          echo "Release JAR class major: ${CLASS_MAJOR}"

          if [ "$CLASS_MAJOR" != "69" ]; then
            echo "ERROR: Expected Java 25 class major 69."
            exit 1
          fi

      - name: Calculate JAR SHA-256
        run: |
          set -euo pipefail

          JAR="$(find target -maxdepth 1 -type f \
            -name 'BedrockAntiDupe-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "ERROR: JAR not found."
            exit 1
          fi

          echo "SHA-256:"
          sha256sum "$JAR" | tee target/BedrockAntiDupe.sha256

      - name: Download official Paper 26.2
        run: |
          set -euo pipefail

          PAPER_VERSION="26.2"
          PAPER_BUILD="121"
          SERVER_DIR="$RUNNER_TEMP/paper-server"
          SERVER_JAR="$SERVER_DIR/paper-${PAPER_VERSION}-${PAPER_BUILD}.jar"

          mkdir -p "$SERVER_DIR"

          API_URL="https://fill.papermc.io/v3/projects/paper/versions/${PAPER_VERSION}/builds"

          echo "Querying official Paper Downloads Service:"
          echo "$API_URL"

          curl --fail-with-body \
            --silent \
            --show-error \
            --location \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            -A "BedrockAntiDupe-CI/2.7.4" \
            "$API_URL" \
            -o "$SERVER_DIR/paper-builds.json"

          python3 - "$SERVER_DIR/paper-builds.json" "$SERVER_JAR" <<'PY'
          import json
          import sys
          import urllib.request

          json_file = sys.argv[1]
          output_file = sys.argv[2]

          with open(json_file, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("ERROR: Unexpected Paper API response.")

          target = None

          for build in data:
              if str(build.get("id")) != "121":
                  continue

              if build.get("channel") != "STABLE":
                  continue

              target = build
              break

          if target is None:
              raise SystemExit(
                  "ERROR: Paper 26.2 build 121 STABLE was not found."
              )

          downloads = target.get("downloads") or {}

          application = downloads.get("server:default") or downloads.get("server")

          if not application:
              raise SystemExit(
                  "ERROR: Paper build does not contain a server download."
              )

          url = application.get("url")

          if not url:
              raise SystemExit(
                  "ERROR: Paper server download URL is missing."
              )

          print("Paper build:", target.get("id"))
          print("Paper channel:", target.get("channel"))
          print("Paper URL:", url)

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "BedrockAntiDupe-CI/2.7.4"
              }
          )

          with urllib.request.urlopen(request, timeout=120) as response:
              with open(output_file, "wb") as out:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      out.write(chunk)

          print("Paper downloaded:", output_file)
          PY

          test -s "$SERVER_JAR"

          echo "SERVER_DIR=$SERVER_DIR" >> "$GITHUB_ENV"
          echo "SERVER_JAR=$SERVER_JAR" >> "$GITHUB_ENV"

      - name: Prepare Paper smoke-test server
        run: |
          set -euo pipefail

          mkdir -p "$SERVER_DIR/plugins"

          cp "$SERVER_JAR" "$SERVER_DIR/paper.jar"

          PLUGIN_JAR="$(find target -maxdepth 1 -type f \
            -name 'BedrockAntiDupe-*.jar' \
            ! -name '*-sources.jar' \
            ! -name '*-javadoc.jar' \
            | head -n 1)"

          if [ -z "$PLUGIN_JAR" ]; then
            echo "ERROR: BedrockAntiDupe JAR not found."
            exit 1
          fi

          cp "$PLUGIN_JAR" "$SERVER_DIR/plugins/BedrockAntiDupe.jar"

          # CI-only EULA agreement.
          # This file is created inside the temporary runner directory
          # and is never committed to the repository.
          printf 'eula=true\n' > "$SERVER_DIR/eula.txt"

          cat > "$SERVER_DIR/server.properties" <<'EOF'
          server-port=25565
          online-mode=false
          enable-command-block=false
          spawn-protection=0
          max-players=4
          view-distance=4
          simulation-distance=4
          motd=BedrockAntiDupe CI Smoke Test
          EOF

          echo "Prepared Paper smoke-test environment."
          find "$SERVER_DIR" -maxdepth 2 -type f -print

      - name: Start Paper 26.2 smoke test
        run: |
          set -euo pipefail

          cd "$SERVER_DIR"

          rm -f server.log

          timeout --preserve-status --signal=TERM 90s \
            java \
              -Xms512M \
              -Xmx1024M \
              -jar paper.jar \
              --nogui \
            > server.log 2>&1 &
          
          SERVER_PID=$!

          echo "Paper PID: $SERVER_PID"

          cleanup() {
            if kill -0 "$SERVER_PID" 2>/dev/null; then
              kill -TERM "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          echo "Waiting for Paper startup..."

          for i in $(seq 1 90); do
            if grep -q "Done (" server.log; then
              echo "Paper startup completed."
              break
            fi

            if grep -Eqi \
              "Could not load|Failed to load|Exception|Error|UnknownDependency|InvalidPluginException" \
              server.log; then

              echo "ERROR: Paper reported a startup/plugin error."
              cat server.log
              exit 1
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "ERROR: Paper process exited unexpectedly."
              cat server.log
              exit 1
            fi

            sleep 1
          done

          if ! grep -q "Done (" server.log; then
            echo "ERROR: Paper did not finish startup within timeout."
            cat server.log
            exit 1
          fi

          echo "Paper startup log:"
          cat server.log

      - name: Verify BedrockAntiDupe loaded
        run: |
          set -euo pipefail

          LOG="$SERVER_DIR/server.log"

          if grep -Eqi \
            "Error occurred while enabling BedrockAntiDupe|Could not load BedrockAntiDupe|InvalidPluginException" \
            "$LOG"; then

            echo "ERROR: BedrockAntiDupe failed to load."
            cat "$LOG"
            exit 1
          fi

          if ! grep -Eqi \
            "\[BedrockAntiDupe\].*(Enabling|Enabled)" \
            "$LOG"; then

            echo "ERROR: BedrockAntiDupe enable message was not detected."
            cat "$LOG"
            exit 1
          fi

          if ! grep -Fq "Paper runtime self-test: PASS" "$LOG"; then
            echo "ERROR: Paper runtime self-test did not pass."
            cat "$LOG"
            exit 1
          fi

          if grep -Fq "Failed to register events for class xyz.zyrex.bedrockantidupe.ExploitProtectionListener" "$LOG"; then
            echo "ERROR: Core listener registration failed."
            cat "$LOG"
            exit 1
          fi

          if grep -Fq "because net/milkbowl/vault/economy/Economy does not exist" "$LOG"; then
            echo "ERROR: Optional Vault integration leaked into core listener loading."
            cat "$LOG"
            exit 1
          fi

          echo "BedrockAntiDupe successfully loaded on Paper 26.2 with optional Vault absent."

      - name: Stop Paper cleanly
        if: always()
        run: |
          set +e

          if [ -n "${SERVER_DIR:-}" ] && [ -f "$SERVER_DIR/server.log" ]; then
            echo "Final Paper log:"
            tail -n 200 "$SERVER_DIR/server.log"
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BedrockAntiDupe-${{ github.sha }}
          path: |
            target/BedrockAntiDupe-*.jar
            target/BedrockAntiDupe.sha256
            target/surefire-reports/**
          if-no-files-found: error
          retention-days: 14
