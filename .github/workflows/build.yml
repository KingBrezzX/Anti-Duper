name: Build BedrockAntiDupe

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Java 25
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Build with Maven
        run: mvn -B clean package

      - name: Verify JAR
        shell: bash
        run: |
          set -e

          echo "Checking target directory..."
          ls -lah target || true

          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*.jar' | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "ERROR: No JAR was generated."
            exit 1
          fi

          echo "JAR generated successfully:"
          echo "$JAR"

          test -f "$JAR"

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: BedrockAntiDupe-2.0.0
          path: target/*.jar
          if-no-files-found: error
