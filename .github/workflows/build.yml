name: Build BedrockAntiDupe

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:

  build:

    name: Build with Java 25

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Validate Maven project
        run: mvn -B validate

      - name: Compile
        run: mvn -B clean compile

      - name: Package
        run: mvn -B package

      - name: Verify JAR
        shell: bash
        run: |
          set -e

          JAR="target/BedrockAntiDupe-1.0.0.jar"

          if [ ! -f "$JAR" ]; then
            echo "ERROR: JAR was not generated."
            exit 1
          fi

          echo "Build successful:"
          ls -lh "$JAR"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BedrockAntiDupe
          path: target/BedrockAntiDupe-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
