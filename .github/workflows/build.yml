name: Build BedrockAntiDupe

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Build and verify
        run: mvn -B -U clean verify

      - name: Verify release version consistency
        shell: bash
        run: |
          set -euo pipefail
          VERSION="2.7.4"
          grep -q "^version: ${VERSION}$" src/main/resources/plugin.yml
          grep -q "<version>${VERSION}</version>" pom.xml
          grep -q "BedrockAntiDupe ${VERSION}" src/main/java/xyz/zyrex/bedrockantidupe/BedrockAntiDupe.java
          grep -q "BedrockAntiDupe ${VERSION}" src/main/resources/config.yml
          echo "Release version consistency: ${VERSION}"

      - name: Verify tests executed
        shell: bash
        run: |
          test -d target/surefire-reports
          TESTS=$(grep -Rho 'tests="[^"]*"' target/surefire-reports/*.xml 2>/dev/null | sed 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
          test "${TESTS:-0}" -gt 0
          echo "Automated tests executed: $TESTS"

      - name: Verify release JAR
        shell: bash
        run: |
          JAR="target/BedrockAntiDupe-2.7.4.jar"
          test -f "$JAR"
          jar tf "$JAR" | grep -q '^plugin.yml$'
          jar tf "$JAR" | grep -q 'xyz/zyrex/bedrockantidupe/BedrockAntiDupe.class'
          MAJOR=$(javap -verbose -classpath "$JAR" xyz.zyrex.bedrockantidupe.BedrockAntiDupe | awk '/major version/ {print $3; exit}')
          test "$MAJOR" = "69"
          echo "Release JAR verified: Java class major 69 (Java 25)"



      - name: Paper 26.2 runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke/plugins
          cp target/BedrockAntiDupe-2.7.4.jar smoke/plugins/
          printf 'eula=true\n' > smoke/eula.txt
          PROJECT="paper"
          PAPER_VERSION="26.2"
          PAPER_BUILD="121"
          USER_AGENT="BedrockAntiDupe-CI/2.7.4 (https://github.com/KingBrezzX/Anti-Duper)"
          command -v jq >/dev/null
          BUILDS_JSON="$(curl -fsSL -H "User-Agent: ${USER_AGENT}" "https://fill.papermc.io/v3/projects/${PROJECT}/versions/${PAPER_VERSION}/builds")"
          PAPER_URL="$(printf '%s' "$BUILDS_JSON" | jq -r --argjson build "$PAPER_BUILD" 'first(.[] | select(.id == $build and .channel == "STABLE") | .downloads."server:default".url) // ""')"
          test -n "$PAPER_URL"
          curl -fsSL -H "User-Agent: ${USER_AGENT}" -o smoke/paper.jar "$PAPER_URL"
          printf 'antidupe status\nstop\n' | timeout 120s java -Xms512M -Xmx1G -jar smoke/paper.jar --nogui > smoke/server.log 2>&1
          cat smoke/server.log
          grep -q "BedrockAntiDupe 2.7.4 enabled" smoke/server.log
          grep -q "SQLite database: true" smoke/server.log
          ! grep -qE "Could not load|Error occurred while enabling BedrockAntiDupe|Exception.*BedrockAntiDupe" smoke/server.log
          grep -q "BedrockAntiDupe" smoke/server.log
          test -f smoke/plugins/BedrockAntiDupe-2.7.4.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BedrockAntiDupe-2.7.4
          path: target/BedrockAntiDupe-2.7.4.jar
          if-no-files-found: error
