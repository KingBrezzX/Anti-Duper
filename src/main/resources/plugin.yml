name: BedrockAntiDupe
version: 2.7.4
main: xyz.zyrex.bedrockantidupe.BedrockAntiDupe
api-version: '26.2'
author: KingBrezzX
description: Premium all-in-one anti-duplication and inventory integrity protection for Paper 26.2 Java Edition.
website: https://github.com/KingBrezzX/Anti-Duper
softdepend:
  - Vault
commands:
  antidupe:
    description: BedrockAntiDupe administration command.
    usage: /antidupe <reload|status|scan [loaded]|cleanup|history|recovery|debug>
    permission: bedrockantidupe.admin
    aliases: [adupe, badupe]
permissions:
  bedrockantidupe.admin:
    description: Access to BedrockAntiDupe administration commands.
    default: op
  bedrockantidupe.notify:
    description: Receive confirmed anti-dupe notifications.
    default: op
  bedrockantidupe.debug:
    description: Access anti-dupe debug information.
    default: op
  bedrockantidupe.bypass:
    description: Bypass anti-dupe detection for trusted testing.
    default: false
