# ==========================================================
# BedrockAntiDupe
# Version: 2.0.0
# ==========================================================

# ----------------------------------------------------------
# GENERAL
# ----------------------------------------------------------

settings:

  # Master switch.
  enabled: true

  # Plugin only reacts to transactions that are actually
  # observed by the server.
  safe-mode: true


# ----------------------------------------------------------
# DETECTION
# ----------------------------------------------------------

detection:

  enabled: true

  # Inventory transactions that deserve additional checking.
  inspect-sensitive-transactions: true

  # Very large instantaneous increases are suspicious.
  #
  # IMPORTANT:
  # This is NOT the only detection method.
  # Normal gameplay must not be punished simply because
  # a player owns many items.
  instant-increase-threshold: 256


# ----------------------------------------------------------
# SHULKER PROTECTION
# ----------------------------------------------------------

shulker:

  enabled: true

  # Automatically covers every vanilla colored shulker box.
  all-colors: true

  # Check shulker-related inventory/container transactions.
  inspect-container-transactions: true

  # Check suspicious rapid movement involving shulkers.
  inspect-rapid-transactions: true


# ----------------------------------------------------------
# SHOP
# ----------------------------------------------------------

shop:

  # Record shop menu context.
  record-context: true

  # Shop inventory title keywords.
  #
  # You can add names used by your own shop plugin.
  title-keywords:

    - "shop"
    - "store"
    - "market"
    - "sell"
    - "buy"
    - "order"
    - "auction"

  # The anti-dupe system must use the ACTUAL recorded
  # transaction price when rolling back money.
  #
  # It must never guess the price from an arbitrary item value.
  require-recorded-price: true


# ----------------------------------------------------------
# ACTIONS
# ----------------------------------------------------------

actions:

  # Remove confirmed duplicated items.
  remove-confirmed-items: true

  # Do NOT remove an item only because it is suspicious.
  remove-only-confirmed: true

  # Send an optional message to the detected player.
  notify-player: false


# ----------------------------------------------------------
# ECONOMY ROLLBACK
# ----------------------------------------------------------

economy:

  enabled: true

  # Only rollback money generated by a recorded transaction.
  require-recorded-transaction: true

  # Never guess the amount.
  use-exact-transaction-value: true

  # If the player has less money than the duplicated sale
  # generated, only the available balance can be withdrawn.
  allow-partial-rollback: true

  # Never allow the balance to become negative.
  prevent-negative-balance: true


# ----------------------------------------------------------
# DISCORD WEBHOOK
# ----------------------------------------------------------

discord:

  enabled: false

  # Put your Discord webhook URL here.
  webhook-url: ""

  # Do not send the same transaction repeatedly.
  prevent-duplicate-alerts: true

  # Minimum time between alerts for the same player.
  cooldown-seconds: 10

  # Send alert when a confirmed duplicated item is removed.
  notify-dupe: true

  # Send alert when money is rolled back.
  notify-economy-rollback: true


# ----------------------------------------------------------
# MAINTENANCE
# ----------------------------------------------------------

maintenance:

  # 1200 ticks = 60 seconds.
  interval-ticks: 1200

  # Temporary transaction data older than this is removed.
  cache-max-age-ms: 300000


# ----------------------------------------------------------
# MESSAGES
# ----------------------------------------------------------

messages:

  dupe-detected: "&c[AntiDupe] Suspicious duplicated item removed."
