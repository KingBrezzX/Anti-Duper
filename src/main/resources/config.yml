# BedrockAntiDupe 2.7.3 | Paper 26.2 | Java 25
settings:
  enabled: true
  require-confirmation: true
  transaction-retention-seconds: 300

detection:
  enabled: true
  track-all-stackable-items: false
  # 1 catches even a single net-positive tracked item. Conservation is checked
  # across the player inventory + viewed container, so normal transfers remain net 0.
  instant-increase-threshold: 1
  tracked-materials:
    - DIAMOND
    - EMERALD
    - NETHERITE_INGOT
    - NETHERITE_BLOCK
    - ANCIENT_DEBRIS
    - GOLD_INGOT
    - GOLD_BLOCK
    - IRON_INGOT
    - IRON_BLOCK

shulker:
  enabled: true
  all-colors: true
  inspect-container-transactions: true
  protect-contents: true

actions:
  remove-confirmed-items: false
  clear-entire-inventory: false
  console-log: true
  staff-notification: true

economy:
  enabled: true
  vault: true
  rollback-confirmed-sales: true
  require-recorded-value: true
  fail-safe: true
  max-single-rollback: 0.0

discord:
  enabled: false
  webhook-url: ""
  notify-dupe: true
  notify-economy-rollback: true
  prevent-duplicate-alerts: true
  cooldown-seconds: 10

shop:
  record-context: true
  # Menus matching one of these keywords are not treated as ordinary inventory transfers.
  title-keywords:
    - shop
    - store
    - market
    - sell
    - buy
    - order
    - auction

evidence:
  enabled: true
  write-cooldown-ms: 1000

debug:
  enabled: false
  console: false
  transactions: false

performance:
  async-processing: true
  max-history-per-player: 50
  cleanup-interval-seconds: 60

console:
  errors: true

safety:
  ignore-operators: true
  bypass-permission: bedrockantidupe.bypass
  require-transaction: true
  require-economy-transaction: false

# Premium protection modules
journal:
  enabled: true
  directory: journal
  max-size-mb: 128

prevention:
  shulker-duplicate-monitor: true
  hopper-monitor: true

protection:
  creative-events: false
  nested-shulker: true
  suspicious-container-movement: true
  burst-window-ms: 75
  max-pending-transactions: 64
  max-scan-chunks-per-tick: 2
  trusted-inventory-titles: []
  trusted-plugins: []
  loaded-container-scan: true
  scan-interval-seconds: 120
recovery:
  enabled: true
  directory: recovery
  require-backup-before-removal: true
  max-records: 10000
fingerprint:
  enabled: true
  shulker-contents: true
  books: true
  custom-items: true

# Optional persistent transaction database. SQLite is bundled in the release JAR.
database:
  enabled: true
  file: antiduper.db
  busy-timeout-ms: 3000

