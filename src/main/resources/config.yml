# ============================================================
# BedrockAntiDupe
# Version 2.0.0
# Paper 26.2 / Java 25
# ============================================================

settings:

  # Master switch.
  enabled: true

  # Never punish players only because an event looks suspicious.
  # A destructive action requires confirmed evidence.
  require-confirmation: true

  # Maximum age of transaction records kept in memory.
  transaction-retention-seconds: 300


# ============================================================
# DETECTION
# ============================================================

detection:

  enabled: true

  # Materials explicitly monitored in addition to shulkers.
  tracked-materials:
    - DIAMOND
    - EMERALD
    - NETHERITE_INGOT
    - NETHERITE_BLOCK
    - ANCIENT_DEBRIS
    - GOLD_INGOT
    - GOLD_BLOCK
    - IRON_INGOT
    - IRON_BLOCK

  # A very large unexpected inventory increase is suspicious.
  #
  # IMPORTANT:
  # This value alone does NOT confirm a dupe.
  instant-increase-threshold: 256


# ============================================================
# SHULKER PROTECTION
# ============================================================

shulker:

  enabled: true

  # Automatically recognize all vanilla colored shulker boxes.
  all-colors: true

  # Inspect transactions involving shulker boxes.
  inspect-container-transactions: true

  # Protect shulker contents from being duplicated through
  # suspicious inventory transactions.
  protect-contents: true


# ============================================================
# ACTIONS
# ============================================================

actions:

  # Remove items ONLY after the detector has confirmed
  # a duplication event.
  remove-confirmed-items: true

  # Never clear the player's complete inventory.
  clear-entire-inventory: false

  # Log confirmed actions to console.
  console-log: true

  # Notify staff with the permission:
  # bedrockantidupe.notify
  staff-notification: true


# ============================================================
# ECONOMY ROLLBACK
# ============================================================

economy:

  enabled: true

  # Requires Vault + an installed economy provider.
  vault: true

  # Roll back money generated by a CONFIRMED duplicated sale.
  rollback-confirmed-sales: true

  # Never guess a sale price.
  #
  # The rollback system must use a recorded transaction value.
  require-recorded-value: true

  # If the exact transaction cannot be verified,
  # do NOT remove arbitrary money from the player.
  fail-safe: true

  # Maximum rollback for a single transaction.
  # 0 = unlimited.
  max-single-rollback: 0.0


# ============================================================
# DISCORD WEBHOOK
# ============================================================

discord:

  enabled: false

  # Put your Discord webhook here.
  #
  # DO NOT publish a real webhook URL to GitHub.
  webhook-url: ""

  # Send confirmed dupe notifications.
  notify-dupe: true

  # Send economy rollback notifications.
  notify-economy-rollback: true

  # Prevent repeated alerts for the same event.
  prevent-duplicate-alerts: true

  # Same event will not be sent repeatedly during this period.
  cooldown-seconds: 10


# ============================================================
# COMMAND / DEBUG
# ============================================================

debug:

  enabled: false

  # Additional detection information in console.
  console: false

  # Transaction snapshots can generate a lot of information.
  # Keep disabled on production servers.
  transactions: false


# ============================================================
# PERFORMANCE
# ============================================================

performance:

  # All heavy/non-critical processing should be asynchronous
  # where Bukkit/Paper API access permits it.
  async-processing: true

  # Maximum number of transaction records held per player.
  max-history-per-player: 50

  # Cleanup interval in seconds.
  cleanup-interval-seconds: 60


# ============================================================
# SAFETY
# ============================================================

safety:

  # Do not punish operators by default.
  ignore-operators: true

  # Players with this permission are ignored.
  bypass-permission: bedrockantidupe.bypass

  # Never remove an item when there is no confirmed transaction.
  require-transaction: true

  # Never perform an economy rollback without a matching
  # recorded economy transaction.
  require-economy-transaction: true
